name: Lua Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    name: Check
    steps:
      - uses: actions/checkout@v7

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luarocksVersion: "3.13.0"

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Install stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: false # Will be run as part of `make check`

      - name: Install lua-language-server
        run: |
          curl -sL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS/lua-language-server-$LUALS-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
          LUALS: 3.19.2

      - name: Check
        run: make check

  test:
    needs: check
    runs-on: ubuntu-26.04
    continue-on-error: false
    strategy:
      fail-fast: true
      matrix:
        lua-version: ['5.1', '5.2', '5.3', '5.4', '5.5', 'luajit-2.0', 'luajit-2.1']

    name: Lua ${{ matrix.lua-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Setup tests
        run: |
          # Set the correct binary name based on the Lua version
          if [[ "${{ matrix.lua-version }}" == luajit* ]]; then
            LUA_BINARY=luajit
          else
            LUA_BINARY=lua
          fi

          echo "LUA_BINARY=$LUA_BINARY" >> "$GITHUB_ENV"
          ${LUA_BINARY} -v

      - name: Run tests
        run: |
          make test-all

  build:
    needs: test
    runs-on: ubuntu-26.04
    name: Build Combined Module
    steps:
      - uses: actions/checkout@v7

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4'

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luarocksVersion: "3.13.0"

      - name: Install amalg
        run: luarocks install amalg

      - name: Build combined module
        run: make build

      - name: Verify build
        run: |
          # Check default build
          if [ -f "build/bitn.lua" ]; then
            echo "✅ build/bitn.lua exists ($(wc -c < "build/bitn.lua") bytes)"
            # Quick sanity check - make sure it contains expected content
            if grep -q "bitn" build/bitn.lua; then
              echo "✅ Build contains expected content"
            else
              echo "❌ Build seems corrupted"
              exit 1
            fi
          else
            echo "❌ build/bitn.lua missing"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bitn.lua
          path: build/bitn.lua
          retention-days: 30
